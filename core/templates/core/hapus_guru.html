<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Hapus Guru - Menabung.Id</title>

    <style>

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            font-family:Arial,sans-serif;
            background:#f5faf7;
            color:#1f2d26;
            padding-bottom:40px;
        }

        .header{
            background:#ffffff;
            border-bottom:1px solid #e2eee7;
            padding:15px;
        }

        .header-left{
            display:flex;
            align-items:center;
            gap:12px;
        }

        .back-btn{
            width:38px;
            height:38px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#eaf7ef;
            color:#278451;
            border-radius:12px;
            text-decoration:none;
            font-size:25px;
        }

        .brand{
            font-size:16px;
            font-weight:800;
            color:#278451;
        }

        .header-title{
            font-size:11px;
            color:#8b9b92;
            margin-top:2px;
        }

        .container{
            width:100%;
            max-width:600px;
            margin:auto;
            padding:22px 15px;
        }

        .page-title{
            font-size:24px;
            font-weight:800;
        }

        .page-subtitle{
            margin-top:6px;
            color:#8a9991;
            font-size:13px;
        }
              .confirm-card{
            margin-top:20px;
            background:#ffffff;
            border:1px solid #e1eee6;
            border-radius:20px;
            padding:22px;
            box-shadow:0 8px 25px rgba(45,108,73,.05);
            text-align:center;
        }

        .warning-icon{
            width:64px;
            height:64px;
            margin:0 auto 15px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#fff0f0;
            color:#d95353;
            border-radius:18px;
            font-size:28px;
        }

        .confirm-title{
            font-size:18px;
            font-weight:800;
            color:#293b31;
        }

        .confirm-text{
            margin-top:8px;
            font-size:13px;
            line-height:1.6;
            color:#84948b;
        }

        .guru-name{
            margin-top:15px;
            padding:13px;
            background:#f0f8f3;
            border-radius:12px;
            color:#278451;
            font-size:14px;
            font-weight:800;
        }

        .warning-text{
            margin-top:12px;
            font-size:11px;
            color:#d95353;
        }

        .button-group{
            display:flex;
            gap:10px;
            margin-top:22px;
        }

        .btn{
            flex:1;
            height:46px;
            border-radius:13px;
            display:flex;
            align-items:center;
            justify-content:center;
            text-decoration:none;
            font-size:13px;
            font-weight:700;
            cursor:pointer;
        }

        .btn-cancel{
            background:#eef5f1;
            color:#5e7568;
            border:1px solid #dce9e1;
        }

        .btn-delete{
            background:#d95353;
            color:#ffffff;
            border:1px solid #d95353;
        }

        .btn:active{
            transform:scale(.98);
          }
              @media(max-width:500px){

            .container{
                padding-left:13px;
                padding-right:13px;
            }

            .confirm-card{
                padding:18px 16px;
                border-radius:18px;
            }

            .button-group{
                flex-direction:column-reverse;
            }

            .btn{
                width:100%;
            }

        }

    </style>

</head>

<body>


<header class="header">

    <div class="header-left">

        <a
            href="{% url 'data_guru' %}"
            class="back-btn">
            ‹
        </a>

        <div>

            <div class="brand">
                Menabung.Id
            </div>

            <div class="header-title">
                Admin • Hapus Guru
            </div>

        </div>

    </div>

</header>
<main class="container">

    <h1 class="page-title">
        Hapus Guru
    </h1>

    <p class="page-subtitle">
        Konfirmasi penghapusan data guru.
    </p>


    <form
        method="post"
        class="confirm-card">

        {% csrf_token %}


        <div class="warning-icon">
            🗑️
        </div>


        <div class="confirm-title">
            Hapus data guru?
        </div>


        <div class="confirm-text">
            Kamu akan menghapus data guru berikut:
        </div>


        <div class="guru-name">
            {{ guru.nama }}
        </div>


        <div class="warning-text">
            ⚠️ Data yang sudah dihapus tidak dapat dikembalikan.
        </div>
                <div class="button-group">

            <a
                href="{% url 'data_guru' %}"
                class="btn btn-cancel">
                Batal
            </a>


            <button
                type="submit"
                class="btn btn-delete">
                🗑️ Hapus Guru
            </button>

        </div>

    </form>

</main>

  </body>
</html>
