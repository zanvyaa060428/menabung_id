<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pengumuman - Menabung.Id</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f8f6;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #16834b;
            text-decoration: none;
            font-size: 14px;
        }

        h2 {
            color: #173b2b;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 18px;
            border-radius: 15px;
            margin-bottom: 13px;
            box-shadow: 0 4px 15px rgba(0,0,0,.05);
        }

        .title {
            font-size: 17px;
            font-weight: bold;
            color: #173b2b;
        }

        .date {
            margin-top: 6px;
            color: #999;
            font-size: 12px;
        }

        .content {
            margin-top: 12px;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        .empty {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            color: #888;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="{% url 'siswa_dashboard' %}" class="back">
        ← Kembali ke Dashboard
    </a>

    <h2>📢 Pengumuman</h2>

    <p class="subtitle">
        Informasi terbaru dari sekolah
    </p>

    {% for item in pengumuman %}

    <div class="card">

        <div class="title">
            {{ item.judul }}
        </div>

        <div class="date">
            {{ item.tanggal|date:"d M Y H:i" }}
        </div>

        <div class="content">
            {{ item.isi }}
        </div>

    </div>

    {% empty %}

    <div class="empty">
        Belum ada pengumuman.
    </div>

    {% endfor %}

</div>

</body>
</html>
