<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hapus Siswa • Menabung.Id</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8f6;
            color: #1f2937;
        }

        .header {
            background: #ffffff;
            padding: 16px 18px;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 28px;
            color: #166534;
            background: #ecfdf5;
            border-radius: 12px;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            color: #166534;
        }

        .header-title {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 24px 18px 40px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 700;
            color: #14532d;
            margin-bottom: 6px;
        }

        .page-subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 24px;
        }

              .confirm-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 24px 20px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .warning-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fef3c7;
            border-radius: 50%;
            font-size: 30px;
        }

        .confirm-title {
            font-size: 19px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 10px;
        }

        .confirm-text {
            font-size: 14px;
            line-height: 1.6;
            color: #6b7280;
            margin-bottom: 18px;
        }

        .student-name {
            display: inline-block;
            padding: 10px 16px;
            background: #ecfdf5;
            color: #166534;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .warning-text {
            font-size: 12px;
            color: #b45309;
            margin-bottom: 22px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 13px 15px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .btn-cancel {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-delete {
            background: #dc2626;
            color: #ffffff;
        }

        .btn-delete:active {
            transform: scale(0.98);
                                        }

      </style>
</head>

<body>

<header class="header">
    <div class="header-left">

        <a href="{% url 'data_siswa' %}" class="back-btn">
            ‹
        </a>

        <div>
            <div class="brand">
                Menabung.Id
            </div>

            <div class="header-title">
                Admin • Hapus Siswa
            </div>
        </div>

    </div>
</header>

<main class="container">

    <h1 class="page-title">
        Hapus Siswa
    </h1>

    <p class="page-subtitle">
        Konfirmasi penghapusan data siswa.
    </p>

    <div class="confirm-card">

        <div class="warning-icon">
            ⚠️
        </div>

        <div class="confirm-title">
            Yakin ingin menghapus siswa ini?
        </div>

        <div class="confirm-text">
            Data siswa yang dihapus tidak dapat dikembalikan melalui halaman ini.
        </div>

              <div class="student-name">
            {{ siswa.nama }}
        </div>

        <div class="student-detail">
            NIS: {{ siswa.nis }}
        </div>

        <div class="warning-text">
            ⚠️ Pastikan siswa yang dipilih sudah benar.
        </div>

              <form method="post" class="button-group">

            {% csrf_token %}

            <a
                href="{% url 'data_siswa' %}"
                class="btn btn-cancel">
                Batal
            </a>

            <button
                type="submit"
                class="btn btn-delete">
                🗑️ Hapus Siswa
            </button>

        </form>

    </div>

</main>

  <script>
    const form = document.querySelector("form");

    form.addEventListener("submit", function (event) {

        const yakin = confirm(
            "Yakin ingin menghapus siswa ini?"
        );

        if (!yakin) {
            event.preventDefault();
            return;
        }

        const button = document.querySelector(".btn-delete");

        button.innerHTML = "⏳ Menghapus...";
        button.disabled = true;
    });
</script>

</body>
</html>
