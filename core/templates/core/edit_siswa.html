<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Siswa • Menabung.Id</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8f6;
            color: #1f2937;
        }

        .header {
            background: #ffffff;
            padding: 16px 18px;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 28px;
            color: #166534;
            background: #ecfdf5;
            border-radius: 12px;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            color: #166534;
        }

        .header-title {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 24px 18px 40px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 700;
            color: #14532d;
            margin-bottom: 6px;
        }

        .page-subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 24px;
        }

              .form-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 20px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            background: #ffffff;
            font-size: 15px;
            color: #111827;
            outline: none;
            transition: 0.2s;
        }

        .form-input:focus,
        .form-select:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12);
        }

        .form-help {
            font-size: 12px;
            color: #6b7280;
            margin-top: 6px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 13px 15px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .btn-cancel {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-save {
            background: #16a34a;
            color: #ffffff;
        }

        .btn-save:active {
            transform: scale(0.98);
      }

      </style>
</head>

<body>

<header class="header">
    <div class="header-left">

        <a href="{% url 'data_siswa' %}" class="back-btn">
            ‹
        </a>

        <div>
            <div class="brand">
                Menabung.Id
            </div>

            <div class="header-title">
                Admin • Edit Siswa
            </div>
        </div>

    </div>
</header>

<main class="container">

    <h1 class="page-title">
        Edit Siswa
    </h1>

    <p class="page-subtitle">
        Perbarui informasi data siswa.
    </p>

    <form method="post" class="form-card">

        {% csrf_token %}

              <div class="form-group">
            <label for="nis" class="form-label">
                NIS
            </label>

            <input
                type="text"
                id="nis"
                name="nis"
                class="form-input"
                value="{{ siswa.nis|default:'' }}"
                placeholder="Masukkan NIS"
                required
            >
        </div>


        <div class="form-group">
            <label for="nama" class="form-label">
                Nama Siswa
            </label>

            <input
                type="text"
                id="nama"
                name="nama"
                class="form-input"
                value="{{ siswa.nama|default:'' }}"
                placeholder="Masukkan nama siswa"
                required
            >
        </div>


        <div class="form-group">
            <label for="kelas_id" class="form-label">
                Kelas
            </label>

            <select
                id="kelas_id"
                name="kelas_id"
                class="form-select"
                required
            >

                <option value="">
                    Pilih Kelas
                </option>

                {% for kelas_item in kelas %}

                <option
                    value="{{ kelas_item.id }}"
                    {% if kelas_item.id == siswa.kelas_id %}
                        selected
                    {% endif %}
                >
                    {{ kelas_item.nama_kelas }}
                </option>

                {% endfor %}

            </select>

            <div class="form-help">
                Pilih kelas siswa.
            </div>
        </div>

              <div class="form-group">
            <label for="saldo" class="form-label">
                Saldo
            </label>

            <input
                type="number"
                id="saldo"
                name="saldo"
                class="form-input"
                value="{{ siswa.saldo|default:0 }}"
                min="0"
                required
            >

            <div class="form-help">
                Masukkan saldo terbaru siswa.
            </div>
        </div>


        <div class="button-group">

            <a
                href="{% url 'data_siswa' %}"
                class="btn btn-cancel">
                Batal
            </a>

            <button
                type="submit"
                class="btn btn-save">
                💾 Simpan Perubahan
            </button>

        </div>

    </form>

  </main>

<script>
    const form = document.querySelector("form");

    form.addEventListener("submit", function () {
        const button = document.querySelector(".btn-save");

        button.innerHTML = "⏳ Menyimpan...";
        button.disabled = true;
    });
</script>

</body>
</html>
