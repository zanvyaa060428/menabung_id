<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Tambah Guru - Menabung.Id</title>

    <style>

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            font-family:Arial,sans-serif;
            background:#f5faf7;
            color:#1f2d26;
            padding-bottom:40px;
        }

        .header{
            background:#ffffff;
            border-bottom:1px solid #e2eee7;
            padding:15px;
        }

        .header-left{
            display:flex;
            align-items:center;
            gap:12px;
        }

        .back-btn{
            width:38px;
            height:38px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#eaf7ef;
            color:#278451;
            border-radius:12px;
            text-decoration:none;
            font-size:25px;
        }

        .brand{
            font-size:16px;
            font-weight:800;
            color:#278451;
        }

        .header-title{
            font-size:11px;
            color:#8b9b92;
            margin-top:2px;
        }

        .container{
            width:100%;
            max-width:600px;
            margin:auto;
            padding:22px 15px;
        }

        .page-title{
            font-size:24px;
            font-weight:800;
        }

        .page-subtitle{
            margin-top:6px;
            color:#8a9991;
            font-size:13px;
        }

              .form-card{
            margin-top:20px;
            background:#ffffff;
            border:1px solid #e1eee6;
            border-radius:20px;
            padding:20px;
            box-shadow:0 8px 25px rgba(45,108,73,.05);
        }

        .form-group{
            margin-bottom:16px;
        }

        .form-group label{
            display:block;
            margin-bottom:7px;
            font-size:12px;
            font-weight:700;
            color:#4d6257;
        }

        .form-group input{
            width:100%;
            height:46px;
            padding:0 13px;
            border:1px solid #dcebe2;
            border-radius:12px;
            outline:none;
            background:#fbfdfc;
            color:#24352c;
            font-size:13px;
        }

        .form-group input:focus{
            border-color:#2d965b;
            background:#ffffff;
        }

        .form-group input::placeholder{
            color:#a7b3ad;
        }

        .form-info{
            margin-top:5px;
            font-size:10px;
            color:#9aa9a1;
        }

        .button-group{
            display:flex;
            gap:10px;
            margin-top:22px;
        }

        .btn{
            flex:1;
            height:46px;
            border-radius:13px;
            display:flex;
            align-items:center;
            justify-content:center;
            text-decoration:none;
            font-size:13px;
            font-weight:700;
            cursor:pointer;
        }

        .btn-cancel{
            background:#eef5f1;
            color:#5e7568;
            border:1px solid #dce9e1;
        }

        .btn-save{
            background:#2d965b;
            color:#ffffff;
            border:1px solid #2d965b;
        }

        .btn-save:active,
        .btn-cancel:active{
            transform:scale(.98);
        }
              .required{
            color:#d95353;
        }

        .section-title{
            font-size:14px;
            font-weight:800;
            color:#2b4035;
            margin-bottom:15px;
        }

        .form-icon{
            margin-right:5px;
        }

        @media(max-width:500px){

            .container{
                padding-left:13px;
                padding-right:13px;
            }

            .form-card{
                padding:16px;
                border-radius:18px;
            }

            .button-group{
                flex-direction:column-reverse;
            }

            .btn{
                width:100%;
            }

        }

    </style>

</head>

<body>

  <header class="header">

    <div class="header-left">

        <a
            href="{% url 'data_guru' %}"
            class="back-btn">
            ‹
        </a>

        <div>

            <div class="brand">
                Menabung.Id
            </div>

            <div class="header-title">
                Admin • Tambah Guru
            </div>

        </div>

    </div>

</header>


<main class="container">

    <h1 class="page-title">
        Tambah Guru
    </h1>

    <p class="page-subtitle">
        Masukkan informasi guru atau petugas baru.
    </p>


    <form
        method="post"
        class="form-card">

        {% csrf_token %}

        <div class="section-title">
            👨‍🏫 Informasi Guru
        </div>


        <div class="form-group">

            <label for="nip">
                NIP <span class="required">*</span>
            </label>

            <input
                type="text"
                id="nip"
                name="nip"
                placeholder="Masukkan NIP"
                required>

            <div class="form-info">
                Masukkan nomor induk pegawai.
            </div>

        </div>


        <div class="form-group">

            <label for="nama">
                Nama Lengkap <span class="required">*</span>
            </label>

            <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Masukkan nama lengkap"
                required>

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="contoh@email.com">

        </div>


        <div class="form-group">

            <label for="no_hp">
                Nomor HP
            </label>

            <input
                type="tel"
                id="no_hp"
                name="no_hp"
                placeholder="08xxxxxxxxxx">

        </div>

              <div class="button-group">

            <a
                href="{% url 'data_guru' %}"
                class="btn btn-cancel">

                Batal

            </a>


            <button
                type="submit"
                class="btn btn-save">

                💾 Simpan Guru

            </button>

        </div>

    </form>

</main>

  </body>

</html>
